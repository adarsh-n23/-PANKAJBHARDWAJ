
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">

<title>PANKAJ BHARDWAJ OFFICIAL</title>

<link rel="stylesheet"

<style>

/* RESET */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    min-height: 100%;
    scroll-behavior: smooth;
}

body {
    min-height: 100vh;
    background: #050505;
    color: white;
    font-family: Arial, sans-serif;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow-x: hidden;
    overflow-y: auto;

    padding: 25px 15px;
    isolation: isolate;
}

/* BACKGROUND */

.background {
    position: fixed;
    inset: 0;

    background:
        radial-gradient(
            ellipse at center,
            #211a0b 0%,
            #080808 65%,
            #000 100%
        );

    z-index: -4;
    pointer-events: none;
}

.grid {
    position: fixed;
    inset: 0;

    background-image:
        linear-gradient(
            rgba(212,175,55,.055) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(212,175,55,.055) 1px,
            transparent 1px
        );

    background-size: 45px 45px;

    z-index: -3;
    pointer-events: none;
}

.glow {
    position: fixed;

    width: 350px;
    height: 350px;

    background: rgba(212,175,55,.13);

    filter: blur(110px);
    border-radius: 50%;

    top: 15%;
    left: 50%;

    transform: translateX(-50%);

    z-index: -2;
    pointer-events: none;
}

/* TRADING CANDLES */

.candles {
    position: fixed;
    inset: 0;

    overflow: hidden;

    z-index: -1;
    opacity: .75;

    pointer-events: none;
}

.candle {
    position: absolute;

    width: 9px;
    height: var(--wick-height);

    left: var(--left);
    top: var(--top);

    animation:
        candleMove var(--speed) ease-in-out infinite alternate;

    animation-delay: var(--delay);
}

.candle .wick {
    position: absolute;

    width: 2px;
    height: 100%;

    left: 50%;
    top: 0;

    transform: translateX(-50%);

    background: var(--color);
    box-shadow: 0 0 8px var(--glow);
}

.candle .body {
    position: absolute;

    width: 9px;
    height: var(--body-height);

    left: 0;
    top: var(--body-top);

    background: var(--color);

    box-shadow: 0 0 12px var(--glow);

    border-radius: 1px;
}

.green {
    --color: #00e676;
    --glow: rgba(0,230,118,.55);
}

.red {
    --color: #ff304f;
    --glow: rgba(255,48,79,.55);
}

@keyframes candleMove {

    0% {
        transform: translateY(35px);
        opacity: .35;
    }

    100% {
        transform: translateY(-55px);
        opacity: 1;
    }

}

/* MAIN CONTAINER */

.container {
    width: 100%;
    max-width: 440px;

    position: relative;
    z-index: 1;

    margin: auto;
    flex-shrink: 0;

    animation: appear 1.2s ease;
}

/* CARD */

.card {
    width: 100%;

    padding: 38px 28px;

    text-align: center;

    border-radius: 25px;

    border: 1px solid rgba(212,175,55,.65);

    background: rgba(12,12,12,.90);

    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);

    box-shadow:
        0 0 40px rgba(212,175,55,.12),
        inset 0 0 25px rgba(212,175,55,.035);
}

/* TOP LABEL */

.top-label {
    color: #d4af37;

    font-size: 10px;
    letter-spacing: 4px;

    margin-bottom: 28px;
}

.top-label i {
    margin-right: 7px;
}

/* PROFILE */

.profile-wrapper {
    width: 145px;
    height: 145px;

    margin: auto;
    padding: 5px;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            #fff0a0,
            #9e791c,
            #fff0a0
        );

    box-shadow:
        0 0 25px rgba(212,175,55,.45);

    animation: pulse 3s infinite;
}

.profile-wrapper img {
    width: 100%;
    height: 100%;

    border-radius: 50%;

    object-fit: cover;

    border: 3px solid #090909;
}

@keyframes pulse {

    50% {
        box-shadow:
            0 0 40px rgba(212,175,55,.7);
    }

}

/* VERIFIED */

.verified {
    display: inline-block;

    margin-top: 23px;
    padding: 7px 15px;

    border-radius: 30px;

    border: 1px solid rgba(212,175,55,.4);

    color: #e7c75e;

    font-size: 10px;
    letter-spacing: 2px;
}

.verified i {
    margin-right: 5px;
}

/* HEADING */

h1 {
    margin-top: 20px;

    font-size: 27px;
    line-height: 1.4;

    letter-spacing: 1px;
}

h1 span {
    display: block;

    color: #e4bf51;

    text-shadow:
        0 0 20px rgba(212,175,55,.3);
}

/* GOLD LINE */

.line {
    width: 75px;
    height: 3px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #e4bf51,
            transparent
        );

    margin: 20px auto;
}

/* DESCRIPTION */

.description {
    color: #aaa;

    font-size: 13px;
    line-height: 1.9;

    max-width: 330px;

    margin: auto;
}

/* DETAILS */

.details {
    display: flex;
    justify-content: center;

    gap: 12px;

    margin: 27px 0;
}

.detail-box {
    flex: 1;
    max-width: 140px;

    padding: 14px 8px;

    background: rgba(255,255,255,.035);

    border: 1px solid rgba(212,175,55,.18);

    border-radius: 12px;

    color: #ccc;

    font-size: 10px;
    letter-spacing: 1px;
}

.detail-box i {
    display: block;

    color: #d4af37;

    font-size: 23px;

    margin-bottom: 9px;
}

/* JOIN BUTTON */

.join-button {
    display: flex;

    align-items: center;
    justify-content: center;

    gap: 12px;

    width: 100%;

    padding: 17px 12px;

    border-radius: 12px;

    background:
        linear-gradient(
            110deg,
            #98701b,
            #ffe18a,
            #b58b2b
        );

    color: #080808;

    text-decoration: none;

    font-size: 13px;
    font-weight: 900;

    letter-spacing: 1px;

    box-shadow:
        0 0 25px rgba(212,175,55,.25);

    transition: .3s;

    animation: buttonGlow 2s infinite alternate;
}

.join-button:hover {
    transform: translateY(-5px) scale(1.02);

    box-shadow:
        0 0 35px rgba(212,175,55,.55);
}

.join-button i {
    font-size: 21px;
}

@keyframes buttonGlow {

    to {
        box-shadow:
            0 0 30px rgba(212,175,55,.45);
    }

}

/* BOTTOM TEXT */

.bottom-text {
    color: #777;

    margin-top: 23px;

    font-size: 9px;
    letter-spacing: 2px;
}

.bottom-text i {
    color: #d4af37;
    margin-right: 5px;
}

/* FOOTER */

footer {
    text-align: center;

    color: #777;

    font-size: 10px;
    letter-spacing: 1px;

    margin-top: 20px;
    padding-bottom: 5px;
}

/* APPEAR ANIMATION */

@keyframes appear {

    from {
        opacity: 0;
        transform: translateY(35px) scale(.96);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }

}

/* MOBILE RESPONSIVE */

@media(max-width:480px) {

    body {
        padding: 20px 12px;
        align-items: flex-start;
    }

    .container {
        margin-top: 5px;
        margin-bottom: 5px;
    }

    .card {
        padding: 30px 19px;
    }

    h1 {
        font-size: 23px;
    }

    .profile-wrapper {
        width: 125px;
        height: 125px;
    }

    .description {
        font-size: 12px;
    }

    .join-button {
        font-size: 12px;
        padding: 17px 10px;
    }

    .top-label {
        font-size: 9px;
        letter-spacing: 3px;
    }

}

/* REDUCED MOTION */

@media(prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }

}

</style>
</head>

<script>

/* CREATE TRADING CANDLES */

const candleContainer =
    document.getElementById("candles");

const candleCount = 65;

for (let i = 0; i < candleCount; i++) {

    const candle = document.createElement("div");

    const isGreen = Math.random() > 0.5;

    const bodyHeight =
        10 + Math.random() * 35;

    const wickHeight =
        bodyHeight + 20 + Math.random() * 35;

    const bodyTop =
        Math.random() * (wickHeight - bodyHeight);

    candle.className =
        "candle " + (isGreen ? "green" : "red");

    candle.style.setProperty(
        "--left",
        Math.random() * 100 + "%"
    );

    candle.style.setProperty(
        "--top",
        Math.random() * 100 + "%"
    );

    candle.style.setProperty(
        "--body-height",
        bodyHeight + "px"
    );

    candle.style.setProperty(
        "--wick-height",
        wickHeight + "px"
    );

    candle.style.setProperty(
        "--body-top",
        bodyTop + "px"
    );

    candle.style.setProperty(
        "--speed",
        (2 + Math.random() * 4) + "s"
    );

    candle.style.setProperty(
        "--delay",
        (-Math.random() * 5) + "s"
    );

    const wick = document.createElement("div");
    wick.className = "wick";

    const body = document.createElement("div");
    body.className = "body";

    candle.appendChild(wick);
    candle.appendChild(body);

    candleContainer.appendChild(candle);

}

</script>
